<div style="background:#0B0B0C;border-radius:16px;padding:0;overflow:hidden;position:relative;height:420px;display:flex;align-items:center;justify-content:center;">
<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,#1a1b1c 0%,#0B0B0C 70%);"></div>

<div id="stage" style="position:relative;width:280px;height:220px;display:flex;align-items:flex-end;justify-content:center;gap:22px;">
<div class="bar" id="b1" style="width:34px;height:0px;background:linear-gradient(180deg,#e9e9e6,#b8b8b3);border-radius:6px 6px 2px 2px;box-shadow:0 0 0px rgba(255,255,255,0);"></div>
<div class="bar" id="b2" style="width:34px;height:0px;background:linear-gradient(180deg,#f4f4f1,#c9c9c4);border-radius:6px 6px 2px 2px;box-shadow:0 0 0px rgba(255,255,255,0);"></div>
<div class="bar" id="b3" style="width:34px;height:0px;background:linear-gradient(180deg,#e9e9e6,#b8b8b3);border-radius:6px 6px 2px 2px;box-shadow:0 0 0px rgba(255,255,255,0);"></div>

<div id="sweep" style="position:absolute;top:-40px;bottom:-20px;left:-60px;width:60px;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0.55) 50%,rgba(255,255,255,0) 100%);transform:skewX(-18deg);opacity:0;"></div>
</div>

<div id="logo" style="position:absolute;bottom:56px;display:flex;align-items:center;gap:8px;opacity:0;">
<div style="width:8px;height:22px;background:#1D9E75;border-radius:2px;"></div>
<span style="font-size:15px;font-weight:500;color:#F5F5F0;letter-spacing:0.5px;">expense</span>
</div>

<button id="replay" style="position:absolute;bottom:14px;right:14px;font-size:12px;padding:5px 10px;background:transparent;color:#9a9a97;border:0.5px solid #3a3a38;border-radius:6px;cursor:pointer;opacity:0.7;">replay</button>
</div>

<script>
function runAnimation(){
  const bars = [document.getElementById('b1'),document.getElementById('b2'),document.getElementById('b3')];
  const heights = [110,170,140];
  const sweep = document.getElementById('sweep');
  const logo = document.getElementById('logo');

  bars.forEach((b,i)=>{
    b.style.transition = 'none';
    b.style.height = '0px';
    b.style.boxShadow = '0 0 0px rgba(255,255,255,0)';
  });
  sweep.style.transition = 'none';
  sweep.style.left = '-60px';
  sweep.style.opacity = '0';
  logo.style.transition = 'none';
  logo.style.opacity = '0';
  logo.style.transform = 'translateY(8px)';

  void document.getElementById('stage').offsetWidth;

  bars.forEach((b,i)=>{
    setTimeout(()=>{
      b.style.transition = 'height 0.7s cubic-bezier(0.22,1,0.36,1), box-shadow 0.7s ease-out';
      b.style.height = heights[i]+'px';
      b.style.boxShadow = '0 0 18px rgba(245,245,240,0.35)';
    }, i*220);
  });

  setTimeout(()=>{
    sweep.style.transition = 'left 0.9s cubic-bezier(0.45,0,0.2,1), opacity 0.3s ease';
    sweep.style.opacity = '1';
    sweep.style.left = '340px';
    setTimeout(()=>{ sweep.style.opacity = '0'; }, 900);
  }, 900);

  setTimeout(()=>{
    logo.style.transition = 'opacity 0.6s ease, transform 0.6s cubic-bezier(0.22,1,0.36,1)';
    logo.style.opacity = '1';
    logo.style.transform = 'translateY(0px)';
  }, 1500);
}
runAnimation();
document.getElementById('replay').addEventListener('click', runAnimation);
</script>
